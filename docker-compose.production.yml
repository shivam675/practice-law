name: megamoot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megamoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-megamoot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megamoot} -d ${POSTGRES_DB:-megamoot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: ${MEGAMOOT_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      # Read by the API and by media; the two must agree or a student is
      # admitted to a room the speech service then refuses.
      MAX_CONCURRENT_LIVE_SESSIONS: ${MAX_CONCURRENT_LIVE_SESSIONS:-2}
      AI_SERVICE_URL: http://ai:8100
      MEDIA_SERVICE_URL: http://media:8200
      API_PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      WEB_PUBLIC_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      COOKIE_DOMAIN: ${DOMAIN}
      COOKIE_SECURE: "true"
      MEDIA_PUBLIC_WS_URL: wss://${DOMAIN}/speech
      BLOB_DRIVER: filesystem
      BLOB_FS_ROOT: /var/lib/megamoot/blobs
    volumes:
      - blobdata:/var/lib/megamoot/blobs
    networks: [backend, parsing]
    # Ollama runs on the host, next to the GPU. Point the model provider at
    # http://host.docker.internal:11434/v1 in Model settings, and start Ollama
    # with OLLAMA_HOST=0.0.0.0 behind a firewall. See docs/deploy.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [parsing]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  media:
    build: ./apps/media
    restart: unless-stopped
    environment:
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN:?set MEDIA_SERVICE_TOKEN}
      CONTROL_API_URL: http://api:8080/api/v1
      MEDIA_ORIGINS: https://${DOMAIN}
      STT_MODEL: ${STT_MODEL:-small.en}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      MAX_CONCURRENT_LIVE_SESSIONS: ${MAX_CONCURRENT_LIVE_SESSIONS:-2}
      # The models are baked into the image at build time.
      HF_HUB_OFFLINE: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 4g
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
      media:
        condition: service_healthy

networks:
  backend:
  parsing:
    internal: true

volumes:
  blobdata:
  caddyconfig:
  caddydata:
  pgdata:
