name: megamoot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megamoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-megamoot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-megamoot}
    ports:
      # 5432 is inside the Windows reserved port range on some hosts
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megamoot} -d ${POSTGRES_DB:-megamoot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/src
      - ./data/blobs:/var/lib/megamoot/blobs
      - gomodcache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Go toolchain without installing Go on the host.
  #   docker compose run --rm go build ./...
  #   docker compose run --rm go test ./...
  # Not started by `docker compose up` because of the tools profile.
  go:
    image: golang:1.23-alpine
    profiles: ["tools"]
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      DATABASE_URL: postgres://${POSTGRES_USER:-megamoot}:${POSTGRES_PASSWORD:-megamoot_dev_password}@postgres:5432/${POSTGRES_DB:-megamoot}_test?sslmode=disable
    volumes:
      - ./apps/api:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    entrypoint: ["go"]

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
